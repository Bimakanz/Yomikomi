<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Yomikomi — Baca Manga & Manhwa Pribadi</title>
  <meta name="description" content="Website pembaca manga pribadi modern Yomikomi dengan antarmuka elegan, mode Webtoon, dan navigasi cepat.">
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yomikomi">
  <meta name="application-name" content="Yomikomi">
  
  <!-- PWA Icons & Apple Touch Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  
  <!-- Preconnect to MangaDex CDN for faster image loads -->
  <link rel="preconnect" href="https://uploads.mangadex.org" crossorigin>
  <link rel="dns-prefetch" href="https://uploads.mangadex.org">

  <!-- Google Fonts: Outfit (Unified Typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- High-Performance Local Vendor Bundles (Zero unpkg network latency) -->
  <script src="/libs/lucide.min.js"></script>
  <script src="/libs/dexie.min.js"></script>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/css/style.css?v=20261020-02">
</head>
<body class="dark-theme">
  <!-- Application Root Container -->
  <div id="app"></div>

  <!-- Client-Side Offline Storage & Queue Engine -->
  <script src="/js/offline-manager.js?v=20261020-02"></script>
  <!-- Modular ES Module Entry Point -->
  <script type="module" src="/js/main.js?v=20261020-02"></script>
</body>
</html>
